[project]
name = "kinesia"
version = "0.2.0"
description = "Multi-person 3D motion capture from a single video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.36.0",
    "numpy>=1.26,<2",
    "opencv-python>=4.10.0.84,<4.13",
    "pycocotools>=2.0.11",
    "torch>=2.7.0",
]

[project.scripts]
kinesia = "kinesia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinesia"]
